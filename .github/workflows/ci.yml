name: Tests

# Runs the workspace tests on every push to main and on every pull request,
# on Linux, Windows and macOS. The lint job gates rustfmt and clippy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      # The same libraries the Linux release build needs (windowing, GL,
      # fonts); the packaging tools are left out.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      # nextest honours .config/nextest.toml, which gives the wall-clock fps
      # probe every core. Plain `cargo test` runs it alongside the suite and
      # reports false 25-32 ms p95 (see the comment in that file).
      - uses: taiki-e/install-action@nextest

      # LC_ALL=C: a few tests compare English message text. The GPU-backed
      # tests are #[ignore]d and need an adapter, so they do not run here.
      - name: cargo nextest
        env:
          LC_ALL: C
        run: cargo nextest run --workspace --locked

      # nextest does not run doctests; keep them covered.
      - name: cargo test --doc
        env:
          LC_ALL: C
        run: cargo test --workspace --doc --locked

  lint:
    name: lint
    runs-on: ubuntu-22.04
    # Blocking: the tree is rustfmt-clean and clippy is at zero warnings
    # (95b7f34), so both checks now gate merges.
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
