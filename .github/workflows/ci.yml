name: Tests

# Runs the workspace tests on every push to main and on every pull request.
# The product is a Windows desktop application: the dependency graph declares
# rayon/ureq/meshopt/i18n-embed under cfg(windows), so Linux and macOS builds
# cannot compile today. The lint job gates rustfmt and clippy on the same
# platform users run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      # nextest honours .config/nextest.toml, which gives the wall-clock fps
      # probe every core. Plain `cargo test` runs it alongside the suite and
      # reports false 25-32 ms p95 (see the comment in that file).
      - uses: taiki-e/install-action@nextest

      # LC_ALL=C: a few tests compare English message text. The GPU-backed
      # tests are #[ignore]d and need an adapter, so they do not run here.
      - name: cargo nextest
        env:
          LC_ALL: C
        run: cargo nextest run --workspace --locked

      # nextest does not run doctests; keep them covered.
      - name: cargo test --doc
        env:
          LC_ALL: C
        run: cargo test --workspace --doc --locked

  lint:
    name: lint
    runs-on: windows-latest
    # Blocking: the tree is rustfmt-clean and clippy is at zero warnings
    # (95b7f34), so both checks now gate merges.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
