[package]
name = "DraftFlowCAD"
version = "1.0.0"
edition = "2021"
build = "build.rs"
default-run = "DraftFlowCAD"
autotests = false

[workspace]
members = [
    "crates/draftflow_plugin_api",
    "crates/draftflow_save",
    "crates/draftflow_web_worker",
    "crates/dwg-thumbnailer",
    "crates/dwg-thumbnailer-win",
]
# Vendored upstream crates keep their own workspace manifests; adopt them as
# plain path dependencies, never as members of this workspace.
exclude = ["vendor"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
calamine = "0.36.1"
base64 = "0.22"
url = "2"
iced = { path = "vendor/iced", features = ["image", "svg", "advanced", "canvas", "smol", "markdown"] }
iced_runtime = { path = "vendor/iced/runtime" }
iced_core = { path = "vendor/iced/core" }
iced_aw = { path = "vendor/iced_aw", features = ["menu", "context_menu", "color_picker", "drop_down"] }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
rfd = "0.17"
clap = { version = "4", features = ["derive", "string"] }
env_logger = "0.11"
log = "0.4"
codec = { package = "draftflowcodec", path = "vendor/draftflowcodec", features = ["serde"] }
kernel = { package = "draftflowkernel", path = "vendor/draftflowkernel", features = ["acis", "offset"] }
kernel-constraints = { package = "draftflowkernel-constraints", path = "vendor/draftflowkernel/crates/draftflowkernel-constraints" }
graph = { package = "draftflowgraph", path = "vendor/draftflowgraph" }
dwg-thumbnailer = { path = "crates/dwg-thumbnailer" }
# Shared SAVE serialization dispatch + web-worker wire format: one
# implementation for the inline (fallback/native) path and the worker path.
draftflow_save = { path = "crates/draftflow_save" }
flate2 = "1"
# Raster decode set: png/jpeg/bmp/tiff plus webp/gif (both pure-Rust in
# image 0.25, so the wasm target stays C-free). Every format named here must
# also appear in the IMAGE picker filter (io::pick_image_file) and the web
# drop filter (io::web_drop::is_image_name).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
hayro = "0.7.1"
kurbo = "0.13"
# DWF/DWFx packages, their XPS pages and DWF/DGN underlay rasters.
zip = { version = "8", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
tiny-skia = "0.11"
# PDF writer shared by desktop export and the web export/preview/print path.
printpdf = { version = "0.9.1", default-features = false, features = ["images"] }
# TrueType subsetting for searchable PDF text (same version printpdf itself
# uses, so no new binary enters the lockfile). Same feature set as printpdf's
# own allsorts use (pure-Rust flate backend) — the defaults would drag in the
# libz-sys C dependency. Pure Rust, so the web build embeds
# the same subsets.
allsorts = { version = "0.16", default-features = false, features = ["flate2_rust"] }
# Rasterises assets/logo.svg into the window icon at startup, so the taskbar
# icon comes from the same file every other build target does. Already in the
# tree behind iced's svg feature; named here only to use it directly.
resvg = { version = "0.45", default-features = false }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
inventory = "0.3"
rustc-hash = "2"
sha2 = "0.10"
fontdb = "0.23"
ttf-parser = "0.25"
# TrueType interpreter for hint-reliant ("tricky") fonts such as DFKai-SB and
# MingLiU, whose raw outlines are missing strokes. Already in the tree (hayro).
skrifa = "0.42.1"
cosmic-text = "0.15"
unicode-bidi = "0.3"
lyon_tessellation = "1.0.20"
pollster = "0.4"

[dev-dependencies]
fluent-syntax = "0.12"
iced_test = { path = "vendor/iced/test" }
naga = { version = "27", features = ["wgsl-in"] }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
# Boot-splash hand-off reaches the window's raw handle to cloak it before its
# first composite; `iced::window::Window` implements `HasWindowHandle`.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_Globalization", "Win32_Security_Authentication_Identity"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "wayland"] }

# For `src/bin/draftflow_launcher.rs` only (the .app's real CFBundleExecutable,
# see that file for why) — already in the tree transitively via winit, pinned
# here to the same versions Cargo already resolves for it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# The `NSEvent`/`block2` features are for the trackpad pinch monitor in
# `src/input/trackpad.rs` — see that file for why the gesture is read there.
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSEvent", "block2"] }
block2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSURL", "NSString", "NSObject", "NSNotification", "NSThread", "NSEnumerator"] }

[patch.crates-io]
iced_core = { path = "vendor/iced/core" }
iced_widget = { path = "vendor/iced/widget" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
draftflow_plugin_api = { path = "crates/draftflow_plugin_api" }
bincode = "1.3"
meshopt = "0.6.2"
i18n-embed = { version = "0.16", features = ["desktop-requester"] }
rayon = "1"
open = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
draftflow_plugin_api = { path = "crates/draftflow_plugin_api" }
i18n-embed = { version = "0.16", features = ["web-sys-requester"] }
rust-embed = { version = "8", features = ["debug-embed"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bincode = "1.3"
web-sys = { version = "=0.3.85", features = [
    "Window",
    "Storage",
    "StorageManager",
    "Navigator",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    # FileSystemFileHandle derefs to FileSystemHandle for the `name()`
    # getter the in-place save (io::fs_access) reads off a picked handle.
    "FileSystemHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "WritableStream",
    "Url",
    "Response",
    # The wasm remote-raster fetch (image_model::fetch_remote_web) builds a
    # `Request` with an `AbortController` signal for its deadline; the fetch
    # rejection is classified via `DomException` (AbortError = timeout) and
    # the body size is pre-checked against the Content-Length `Headers`.
    "Request",
    "RequestInit",
    "AbortController",
    "AbortSignal",
    "DomException",
    "Headers",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "ErrorEvent",
    "Clipboard",
    # The web image paste reads `navigator.clipboard.read()` items
    # (sys::read_clipboard_image): their `types()`/`getType()` surface lives
    # on ClipboardItem.
    "ClipboardItem",
    "KeyboardEvent",
    "KeyboardEventInit",
    "EventInit",
    "EventTarget",
    "BeforeUnloadEvent",
    # COLORSCHEME SYSTEM resolves prefers-color-scheme through a media
    # query listener read at boot and on every re-run.
    "MediaQueryList",
    "console",
    "Node",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "DragEvent",
    "DataTransfer",
    "FileList",
    "Event",
    "ReadableStreamDefaultReader",
    "ReadableStream",
    # The ?file= boot deep link reads location.search and compares the link's
    # origin against the page's (io::web_link).
    "Location",
] }
iced = { path = "vendor/iced", features = ["webgl", "fira-sans"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = 1

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[[bench]]
name = "performance_benchmarks"
harness = false

[[bench]]
name = "command_benchmarks"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "one_pen_stroke_width"
path = "tests/one_pen_stroke_width.rs"

# Standalone like the icon guard above it: it reads only shipped bytes
# (`packaging/windows/*.ico`, `main.wxs`, `file_association.rs`), so it needs no
# engine and belongs on the pre-build gate, not inside the big binary.
[[test]]
name = "file_icon_assets"
path = "tests/file_icon_assets.rs"
