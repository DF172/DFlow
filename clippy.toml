# Clippy thresholds for this codebase.
# Structural lints (arg count / type complexity / enum payload size / error size)
# are managed here instead of being silenced per-site; the mechanical lints are
# fixed in code.
too-many-arguments-threshold = 12
type-complexity-threshold = 500
# Entity enums carry the full payload inline (Hatch, Solid3D, ...); boxing the
# variants would ripple through the entity model, DXF codec and renderer for no
# runtime gain at the sizes we keep.
enum-variant-size-threshold = 6144
# Reader errors embed a full context string; 128 bytes is too tight for them.
large-error-threshold = 256
